# Tests, types and the policy drift check on every pull request and on the
# release branches. Org lint (required by the org ruleset) runs separately.

name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: The bundled policy is nyuchi/.github's, unchanged
        run: scripts/check-policy.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The Worker bundles
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle"

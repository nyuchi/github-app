# Ships the Worker. Checks run in CI and the org-required Org lint.
#
#   push to main     wrangler deploy           -> nyuchi-github-app.nyuchi.workers.dev
#   push to staging  wrangler versions upload  -> preview alias "staging"
#                    (never deployed, so production keeps serving main)
#
# Both are gated on the repository variable DEPLOY_ENABLED == 'true'. The
# first deploy is made by hand (the owner checklist in nyuchi/.github#90);
# the variable is set after it, so CI never creates the Worker.
#
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are the nyuchi org secrets.
# The App's key and webhook secret are in the Cloudflare Secrets Store and
# never pass through CI.

name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (main)
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: The bundled policy is nyuchi/.github's, unchanged
        run: scripts/check-policy.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health answers
        run: |
          curl -fsS https://nyuchi-github-app.nyuchi.workers.dev/ | jq -e '.name == "nyuchi-github-app"'

  beta:
    name: Beta (preview version from staging)
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: The bundled policy is nyuchi/.github's, unchanged
        run: scripts/check-policy.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload a preview version aliased staging
        run: >-
          npx wrangler versions upload --preview-alias staging
          --message "staging ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
